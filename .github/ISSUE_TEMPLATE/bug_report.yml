name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! Please remove API keys, connect codes and personal links before posting. Security problems: see SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Import ...\n2. Click Analyze ...\n3. See error ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Helper output or browser console errors
      render: text
  - type: input
    id: version
    attributes:
      label: ReelMind version
      description: Shown when the helper starts.
  - type: input
    id: env
    attributes:
      label: OS, browser and Node version
      placeholder: "Windows 11, Chrome 141, Node 22.11"
